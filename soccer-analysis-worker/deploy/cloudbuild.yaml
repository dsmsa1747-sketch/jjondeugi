# ── 워커: 빌드+푸시+Cloud Run(GPU) 배포를 전부 Google 서버에서 ──
# 로컬 터미널과 무관하게 끝까지 실행됩니다(끊겨도 OK).
timeout: 3600s
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  # bash 스크립트 안의 $VAR 를 Cloud Build 치환으로 오해하지 않도록 허용
  substitution_option: 'ALLOW_LOOSE'

substitutions:
  _REGION: us-central1

steps:
  # 0) Artifact Registry 저장소 준비(없으면 생성, 있으면 통과)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe cloud-run-source-deploy --location=${_REGION} || \
        gcloud artifacts repositories create cloud-run-source-deploy \
          --repository-format=docker --location=${_REGION}

  # 1) 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/soccermom-yolo-worker'
      - .

  # 2) 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/soccermom-yolo-worker'

  # 3) Cloud Run(GPU) 배포 (버킷 자동 생성 포함)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        BUCKET="$PROJECT_ID-soccermom"
        gcloud storage buckets create "gs://$$BUCKET" --location=${_REGION} || true
        gcloud run deploy soccermom-yolo-worker \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/soccermom-yolo-worker \
          --region=${_REGION} \
          --gpu=1 --gpu-type=nvidia-l4 \
          --cpu=4 --memory=16Gi --no-cpu-throttling \
          --min-instances=0 --max-instances=3 --concurrency=1 --timeout=1800 \
          --no-allow-unauthenticated \
          --set-env-vars="GCP_PROJECT=$PROJECT_ID,GCS_BUCKET=$$BUCKET,FIRESTORE_COLLECTION=analysisJobs,NOTIFY_PROVIDER=none"

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/soccermom-yolo-worker'
