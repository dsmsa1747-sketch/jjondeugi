<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#16A34A" />
<title>콩나물 — 신선함을 잇다</title>
<meta name="description" content="콩나물 — 신선 농산물·식품 커머스. 회원가입·결제·주문까지 한 곳에서." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<!-- 토스페이먼츠 결제 SDK (실 키 설정 시에만 사용) -->
<script src="https://js.tosspayments.com/v1/payment"></script>
<style>
:root{
  --primary:#16A34A; --primary-dark:#15803D; --primary-light:#DCFCE7; --primary-bg:#F0FDF4;
  --cta:#1B64DA; --cta-dark:#1957C2;
  --bg:#FFFFFF; --bg2:#F8FAFB; --bg3:#F1F4F6;
  --text:#191F28; --text2:#4E5968; --text3:#8B95A1; --text4:#B0B8C1;
  --border:#E5E8EB; --border2:#D1D6DB;
  --red:#F04452; --orange:#FF8A00; --yellow:#FFC233;
  --radius:12px; --radius-lg:16px; --radius-xl:20px;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.08);
  --maxw:480px; --tabh:60px; --headerh:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg3);color:var(--text);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

/* ---- Layout ---- */
#app{max-width:var(--maxw);margin:0 auto;background:var(--bg);min-height:100vh;position:relative;box-shadow:0 0 40px rgba(0,0,0,.05);overflow-x:hidden}
.header{height:var(--headerh);display:flex;align-items:center;gap:8px;padding:0 16px;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);z-index:60;border-bottom:1px solid var(--border)}
.header .logo{font-size:20px;font-weight:800;color:var(--primary);letter-spacing:-.02em;display:flex;align-items:center;gap:4px}
.header .spacer{flex:1}
.header .hicon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--text2);position:relative;font-size:20px}
.header .hicon:active{background:var(--bg3)}
.header .back{font-size:24px;color:var(--text);width:32px;height:40px;display:flex;align-items:center}
.header .title{font-size:17px;font-weight:700}
.badge-count{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;background:var(--red);color:#fff;border-radius:8px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.view{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);min-height:calc(100vh - var(--headerh));animation:fade .25s ease}
.view.nofooter{padding-bottom:24px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---- Tab bar ---- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--maxw);height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:60}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text4);font-size:11px;font-weight:600;transition:color .15s}
.tab .ic{font-size:22px;line-height:1}
.tab.active{color:var(--primary)}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:52px;padding:0 20px;border-radius:var(--radius);font-size:16px;font-weight:700;transition:transform .1s,background .15s,opacity .15s;width:100%}
.btn:active{transform:scale(.985)}
.btn.cta{background:var(--cta);color:#fff}.btn.cta:active{background:var(--cta-dark)}
.btn.primary{background:var(--primary);color:#fff}.btn.primary:active{background:var(--primary-dark)}
.btn.sub{background:var(--bg3);color:var(--text)}
.btn.line{background:#fff;border:1.5px solid var(--border2);color:var(--text)}
.btn.sm{height:40px;font-size:14px;padding:0 14px;border-radius:10px;width:auto}
.btn.kakao{background:#FEE500;color:#191600}
.btn.naver{background:#03C75A;color:#fff}
.btn:disabled{opacity:.5;pointer-events:none}

/* ---- Forms ---- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:7px}
.input{width:100%;height:52px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:0 16px;font-size:16px;transition:border .15s,background .15s}
.input:focus{outline:none;border-color:var(--primary);background:#fff}
textarea.input{height:auto;padding:14px 16px;resize:vertical;min-height:90px}
.input::placeholder{color:var(--text4)}

/* ---- Cards & misc ---- */
.sec{padding:16px}
.sec-title{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
.sec-sub{font-size:13px;color:var(--text3);margin-bottom:14px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:600;background:var(--bg3);color:var(--text2);white-space:nowrap}
.chip.on{background:var(--primary);color:#fff}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700}
.pill.g{background:var(--primary-light);color:var(--primary-dark)}
.pill.o{background:#FFF1E0;color:var(--orange)}
.pill.r{background:#FFE9EB;color:var(--red)}
.pill.b{background:#E5EFFF;color:var(--cta)}
.divider{height:8px;background:var(--bg3)}
.hr{height:1px;background:var(--border);margin:0}

/* ---- Product grid ---- */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
.pcard{cursor:pointer}
.pcard .thumb{aspect-ratio:1;border-radius:var(--radius-lg);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden;position:relative;border:1px solid var(--border)}
.pcard .thumb .liked{position:absolute;top:8px;right:8px;font-size:20px}
.pcard .pname{font-size:14px;font-weight:600;margin-top:8px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.pcard .pprice{font-size:16px;font-weight:800;margin-top:2px}
.pcard .pmeta{font-size:11px;color:var(--text3);margin-top:3px}

/* ---- Banner / hero ---- */
.hero{margin:16px;border-radius:var(--radius-xl);padding:26px 22px;background:linear-gradient(135deg,#16A34A 0%,#22C55E 100%);color:#fff;position:relative;overflow:hidden}
.hero h2{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.hero p{font-size:14px;opacity:.92;margin-top:8px}
.hero .emoji{position:absolute;right:-6px;bottom:-12px;font-size:96px;opacity:.25}

/* ---- List rows ---- */
.row{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .rthumb{width:64px;height:64px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;border:1px solid var(--border)}
.row .rbody{flex:1;min-width:0}
.row .rtitle{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rsub{font-size:12px;color:var(--text3);margin-top:3px}
.row .rright{text-align:right;flex-shrink:0}
.menu-row{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border);font-size:15px;font-weight:500}
.menu-row .mic{font-size:20px}
.menu-row .arrow{margin-left:auto;color:var(--text4)}

/* ---- Quantity stepper ---- */
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.qty button{width:36px;height:36px;font-size:18px;color:var(--text2);background:#fff}
.qty button:active{background:var(--bg3)}
.qty span{width:40px;text-align:center;font-weight:700;font-size:15px}

/* ---- Bottom fixed bar (detail/checkout) ---- */
.fixedbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--maxw);background:#fff;border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:55}

/* ---- Empty & loading ---- */
.empty{text-align:center;padding:64px 24px;color:var(--text3)}
.empty .ee{font-size:56px;margin-bottom:14px}
.empty .et{font-size:16px;font-weight:600;color:var(--text2)}
.empty .es{font-size:13px;margin-top:6px}
.skel{background:linear-gradient(90deg,#eef1f3 25%,#f6f8f9 50%,#eef1f3 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---- Toast ---- */
#toast{position:fixed;bottom:calc(var(--tabh) + 24px);left:50%;transform:translateX(-50%) translateY(20px);background:#191F28;color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90%;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- Modal sheet ---- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:var(--maxw);background:#fff;border-radius:20px 20px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:.25s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto}
.sheet-bg.show .sheet{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:8px auto 12px}
.sheet h3{font-size:18px;font-weight:800;padding:0 20px 12px}

/* ---- Stat tiles ---- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat .sl{font-size:12px;color:var(--text3)}
.stat .sv{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.stat .sv.g{color:var(--primary)}

.notice{background:var(--primary-bg);border:1px solid var(--primary-light);color:var(--primary-dark);font-size:12.5px;padding:10px 14px;border-radius:10px;margin:0 16px 14px;line-height:1.5}
.tabs-line{display:flex;border-bottom:1px solid var(--border);position:sticky;top:var(--headerh);background:#fff;z-index:50}
.tabs-line .t{flex:1;text-align:center;padding:14px 0;font-size:14px;font-weight:600;color:var(--text3);border-bottom:2px solid transparent}
.tabs-line .t.on{color:var(--text);border-bottom-color:var(--text)}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>

<script>
/* ============================================================
   콩나물 — 신선 커머스 SPA
   - 백엔드(Google Apps Script) URL 미설정 시 데모 모드(localStorage)로 동작
   - CONFIG.API_BASE 에 Apps Script 웹앱 URL 입력 시 실서비스로 전환
   ============================================================ */

const CONFIG = {
  // 🔧 Google Apps Script 웹앱 배포 URL을 여기에 붙여넣으면 실서비스로 전환됩니다.
  //    예: 'https://script.google.com/macros/s/AKfycb..../exec'
  //    비워두면 브라우저 localStorage 기반 데모 모드로 동작합니다.
  API_BASE: '',

  // 🔧 토스페이먼츠 클라이언트 키 (test_ck_... 또는 live_ck_...).
  //    값이 'test_ck_'/'live_ck_'로 시작하지 않으면 결제는 시뮬레이션으로 처리됩니다.
  TOSS_CLIENT_KEY: '',

  BRAND: '콩나물',
  FEE_RATE: 0.03,          // 플랫폼 수수료 3%
  FREE_SHIP_OVER: 30000,   // 3만원 이상 무료배송
  SHIP_FEE: 3000,
  // 수익 분배 (Atomic): 브랜드사 90% / 콩나물 7% / 오너 3% (즉시 캐시백)
  SPLIT: { brand:0.90, platform:0.07, owner:0.03 },
  WITHHOLD: 0.033,         // 출금 시 3.3% 원천징수
};

/* ---------- 유틸 ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const won = n => '₩' + Number(n||0).toLocaleString('ko-KR');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get:(k,d)=>{try{return JSON.parse(localStorage.getItem('kn_'+k))??d}catch{return d}},
  set:(k,v)=>localStorage.setItem('kn_'+k,JSON.stringify(v)),
};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheetbg').classList.add('show')}
function closeSheet(){$('#sheetbg').classList.remove('show')}
$('#sheetbg').addEventListener('click',e=>{if(e.target.id==='sheetbg')closeSheet()});

/* ---------- 샘플 데이터 (데모/초기 시드) ---------- */
const SEED_PRODUCTS = [
  {id:'p1',name:'국산 무농약 콩나물 300g',price:2200,cat:'채소',emoji:'🌱',seller:'새벽농장',stock:120,sales:842,desc:'아삭한 식감의 국산 무농약 콩나물. 당일 수확 후 바로 배송합니다.'},
  {id:'p2',name:'유기농 시금치 한 단',price:3500,cat:'채소',emoji:'🥬',seller:'들녘농원',stock:64,sales:311,desc:'유기농 인증 시금치. 무침·국 어디에나 좋아요.'},
  {id:'p3',name:'알이 꽉 찬 방울토마토 1kg',price:8900,cat:'과일',emoji:'🍅',seller:'햇살팜',stock:38,sales:520,desc:'당도 9brix 이상의 프리미엄 방울토마토.'},
  {id:'p4',name:'갓 볶은 원두 200g (홀빈)',price:12000,cat:'가공식품',emoji:'☕',seller:'로스터리K',stock:90,sales:177,desc:'주문 즉시 로스팅하는 스페셜티 원두.'},
  {id:'p5',name:'제주 감귤 3kg',price:15900,cat:'과일',emoji:'🍊',seller:'제주직송',stock:25,sales:998,desc:'새콤달콤 제주 노지 감귤. 산지 직송.'},
  {id:'p6',name:'유정란 특란 15구',price:7200,cat:'축산',emoji:'🥚',seller:'행복한닭',stock:140,sales:430,desc:'동물복지 인증 농장의 신선한 유정란.'},
  {id:'p7',name:'국산 햇감자 2kg',price:6900,cat:'채소',emoji:'🥔',seller:'강원감자',stock:77,sales:265,desc:'포슬포슬한 강원도 햇감자.'},
  {id:'p8',name:'손질 새송이버섯 500g',price:4500,cat:'채소',emoji:'🍄',seller:'버섯마을',stock:52,sales:188,desc:'바로 요리하는 손질 새송이버섯.'},
];
const SEED_LIVE = [
  {id:'l1',title:'제주 감귤 산지 라이브 특가',host:'제주직송',status:'live',viewers:1284,emoji:'🍊'},
  {id:'l2',title:'새벽농장 콩나물 키우기 비하인드',host:'새벽농장',status:'soon',startAt:'오늘 20:00',emoji:'🌱'},
  {id:'l3',title:'로스터리K 원두 블라인드 테스트',host:'로스터리K',status:'soon',startAt:'내일 19:30',emoji:'☕'},
];
const SEED_FUNDING = [
  {id:'f1',name:'산지직송 제주 감귤 공동구매',emoji:'🍊',goal:5000000,raised:4120000,supporters:512,dday:3},
  {id:'f2',name:'무농약 콩나물 정기배송 펀딩',emoji:'🌱',goal:3000000,raised:1850000,supporters:266,dday:7},
  {id:'f3',name:'스페셜티 원두 한정 로스팅',emoji:'☕',goal:2000000,raised:2240000,supporters:401,dday:1},
];
const CATS = ['전체','채소','과일','축산','가공식품'];

/* ============================================================
   API 레이어 — 백엔드 있으면 GAS 호출, 없으면 데모(localStorage)
   ============================================================ */
const hasBackend = () => /^https:\/\/script\.google\.com/.test(CONFIG.API_BASE);

async function api(action, payload={}){
  if(hasBackend()){
    const res = await fetch(CONFIG.API_BASE, {
      method:'POST',
      // GAS 웹앱 CORS preflight 회피를 위해 text/plain 사용
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, token: state.token, payload}),
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error||'요청 실패');
    return data.result;
  }
  return demoApi(action, payload);
}

/* ---------- 데모 백엔드 ---------- */
async function demoApi(action, p){
  await new Promise(r=>setTimeout(r, 220)); // 네트워크 느낌
  const users = ls.get('users', []);
  let products = ls.get('products', null);
  if(!products){ products = SEED_PRODUCTS.slice(); ls.set('products', products); }
  let orders = ls.get('orders', []);

  switch(action){
    case 'listProducts': return products;
    case 'getProduct': return products.find(x=>x.id===p.id)||null;
    case 'listLive': return SEED_LIVE;
    case 'listFunding': return SEED_FUNDING;

    case 'becomeOwner': {
      const s=ls.get('session',null); if(!s) throw new Error('로그인이 필요합니다.');
      const u=users.find(x=>x.id===s.uid); if(!u) throw new Error('회원 정보를 찾을 수 없습니다.');
      u.role='owner'; if(!u.ownerCode) u.ownerCode=(u.name||'KN').slice(0,2).toUpperCase()+uid().slice(0,4).toUpperCase();
      ls.set('users',users); return safeUser(u);
    }
    case 'ownerStats': {
      const s=ls.get('session',null); if(!s) throw new Error('로그인이 필요합니다.');
      const u=users.find(x=>x.id===s.uid)||{};
      const mine=orders.filter(o=>o.uid===s.uid && o.status!=='결제대기');
      const gmv=mine.reduce((t,o)=>t+o.amount,0);
      const earned=Math.round(gmv*0.03);
      const withdraws=ls.get('withdraws',[]).filter(w=>w.uid===s.uid);
      const withdrawn=withdraws.reduce((t,w)=>t+w.net,0);
      return {ownerCode:u.ownerCode||'-', gmv, earned, orders:mine.length,
        available:Math.max(0,earned-withdraws.reduce((t,w)=>t+w.gross,0)), withdrawn, withdraws};
    }
    case 'requestWithdraw': {
      const s=ls.get('session',null); if(!s) throw new Error('로그인이 필요합니다.');
      const gross=Math.floor(p.amount||0); if(gross<10000) throw new Error('최소 출금액은 10,000원입니다.');
      const tax=Math.round(gross*CONFIG.WITHHOLD); const net=gross-tax;
      const ws=ls.get('withdraws',[]); ws.push({id:uid(),uid:s.uid,gross,tax,net,status:'신청완료',createdAt:Date.now()});
      ls.set('withdraws',ws); return {gross,tax,net};
    }

    case 'signup': {
      if(users.some(u=>u.email===p.email)) throw new Error('이미 가입된 이메일입니다.');
      const u={id:uid(),email:p.email,name:p.name,phone:p.phone||'',pw:p.pw,role:'buyer',createdAt:Date.now()};
      users.push(u); ls.set('users',users);
      const token='demo.'+u.id; ls.set('session',{token,uid:u.id});
      return {token, user:safeUser(u)};
    }
    case 'login': {
      const u=users.find(x=>x.email===p.email && x.pw===p.pw);
      if(!u) throw new Error('이메일 또는 비밀번호가 올바르지 않습니다.');
      const token='demo.'+u.id; ls.set('session',{token,uid:u.id});
      return {token, user:safeUser(u)};
    }
    case 'social': {
      const email=p.provider+'_user@'+p.provider+'.demo';
      let u=users.find(x=>x.email===email);
      if(!u){ u={id:uid(),email,name:p.provider==='kakao'?'카카오회원':'네이버회원',phone:'',pw:'',role:'buyer',createdAt:Date.now()}; users.push(u); ls.set('users',users); }
      const token='demo.'+u.id; ls.set('session',{token,uid:u.id});
      return {token, user:safeUser(u)};
    }
    case 'me': {
      const s=ls.get('session',null); if(!s) return null;
      const u=users.find(x=>x.id===s.uid); return u?safeUser(u):null;
    }
    case 'logout': ls.set('session',null); return true;

    case 'listOrders': {
      const s=ls.get('session',null); if(!s) return [];
      return orders.filter(o=>o.uid===s.uid).sort((a,b)=>b.createdAt-a.createdAt);
    }
    case 'createOrder': {
      const s=ls.get('session',null); if(!s) throw new Error('로그인이 필요합니다.');
      const o={id:'ORD-'+uid().toUpperCase(),uid:s.uid,items:p.items,amount:p.amount,
        ship:p.ship,status:'결제대기',createdAt:Date.now()};
      orders.push(o); ls.set('orders',orders);
      return o;
    }
    case 'confirmPayment': {
      orders=ls.get('orders',[]);
      const o=orders.find(x=>x.id===p.orderId);
      if(o){ o.status='결제완료'; o.paymentKey=p.paymentKey||'demo_'+uid(); o.paidAt=Date.now(); ls.set('orders',orders); }
      return o;
    }
    default: throw new Error('알 수 없는 요청: '+action);
  }
}
function safeUser(u){return {id:u.id,email:u.email,name:u.name,phone:u.phone,role:u.role}}

const state = {

  products:[], cat:'전체', query:'',
  cart: ls.get('cart',[]),       // [{id,qty}]
  detailId:null, loading:false,
};

function setCart(c){ state.cart=c; ls.set('cart',c); }
function cartCount(){ return state.cart.reduce((s,i)=>s+i.qty,0); }
function cartItems(){ return state.cart.map(c=>({...productById(c.id),qty:c.qty})).filter(x=>x.id); }
function cartSubtotal(){ return cartItems().reduce((s,i)=>s+i.price*i.qty,0); }
function shipFee(sub){ return sub>=CONFIG.FREE_SHIP_OVER||sub===0?0:CONFIG.SHIP_FEE; }
function productById(id){ return state.products.find(p=>p.id===id); }

function go(page, opts={}){
  state.page=page;

function headerHTML(){

    cart:'장바구니',checkout:'주문/결제',login:'로그인',signup:'회원가입',

    </div>`;

    : '';

    ? `<div class="spacer"></div><button class="hicon" onclick="go('cart')">🛒${cartBadge()}</button>` : '';

}

      <div class="rright"><button class="hicon" style="font-size:16px" onclick="removeCart('${it.id}')">✕</button>
        <div style="font-weight:800;margin-top:18px">${won(it.price*it.qty)}</div></div>
    </div>`).join('');
}
function changeQty(id,d){ const c=state.cart.slice(); const f=c.find(i=>i.id===id); if(!f)return; f.qty=Math.max(1,f.qty+d); setCart(c); render(); }
function removeCart(id){ setCart(state.cart.filter(i=>i.id!==id)); render(); }
function goCheckout(){ if(!state.user){ go('login'); return; } go('checkout'); }

/* ---------- 체크아웃 ---------- */
function CheckoutView(v){
  const items=cartItems(); if(!items.length){ go('cart'); return; }
  const sub=cartSubtotal(), ship=shipFee(sub), total=sub+ship;
  const u=state.user;
  v.innerHTML=`
    <div class="sec"><div class="sec-title" style="font-size:16px">받는 사람</div></div>
    <div class="sec" style="padding-top:0">
      <div class="field"><label>이름</label><input class="input" id="rname" value="${esc(u.name||'')}"></div>
      <div class="field"><label>연락처</label><input class="input" id="rphone" value="${esc(u.phone||'')}" placeholder="010-0000-0000"></div>
      <div class="field"><label>주소</label><input class="input" id="raddr" placeholder="배송지를 입력하세요"></div>
      <div class="field"><label>배송 요청사항</label><input class="input" id="rmemo" placeholder="예) 문 앞에 놔주세요"></div>
    </div>
    <div class="divider"></div>
    <div class="sec"><div class="sec-title" style="font-size:16px">결제 수단</div></div>
    <div class="scroll-x">
      ${['카드','계좌이체','간편결제'].map((m,i)=>`<div class="chip ${i===0?'on':''}" data-pm="${m}">${m}</div>`).join('')}
    </div>
    <div class="divider"></div>
    <div class="sec">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;color:var(--text2)"><span>상품금액</span><span>${won(sub)}</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;color:var(--text2)"><span>배송비</span><span>${ship?won(ship):'무료'}</span></div>
      <div class="hr" style="margin:10px 0"></div>
      <div style="display:flex;justify-content:space-between;font-size:17px;font-weight:800"><span>최종 결제금액</span><span style="color:var(--primary)">${won(total)}</span></div>
    </div>
    ${hasBackend()&&CONFIG.TOSS_CLIENT_KEY?'':'<div class="notice">💳 현재 결제는 <b>시뮬레이션</b>으로 처리됩니다. 실결제는 토스 클라이언트 키 + 백엔드 연결 후 자동 활성화됩니다.</div>'}
    <div class="fixedbar"><button class="btn cta" id="payBtn" onclick="pay(${total})">${won(total)} 결제하기</button></div>`;
  v.querySelectorAll('[data-pm]').forEach(c=>c.onclick=()=>{v.querySelectorAll('[data-pm]').forEach(x=>x.classList.remove('on'));c.classList.add('on');});
}

async function pay(total){
  const btn=$('#payBtn'); if(btn){btn.disabled=true;btn.textContent='주문 생성 중...';}
  const items=cartItems().map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty,emoji:i.emoji}));
  const sub=cartSubtotal(), ship=shipFee(sub);
  try{
    const order = await api('createOrder',{items,amount:total,ship:{
      name:$('#rname')?.value, phone:$('#rphone')?.value, addr:$('#raddr')?.value, memo:$('#rmemo')?.value }});
    const useToss = /^(test_ck_|live_ck_)/.test(CONFIG.TOSS_CLIENT_KEY) && typeof TossPayments!=='undefined';
    if(useToss){
      const toss=TossPayments(CONFIG.TOSS_CLIENT_KEY);
      await toss.requestPayment('카드',{
        amount: total, orderId: order.id,
        orderName: items[0].name + (items.length>1?` 외 ${items.length-1}건`:''),
        customerName: state.user.name,
        successUrl: location.origin+location.pathname+'?pay=success',
        failUrl: location.origin+location.pathname+'?pay=fail',
      });
      return; // 토스 페이지로 리다이렉트
    }
    // 시뮬레이션 결제
    await new Promise(r=>setTimeout(r,700));
    await api('confirmPayment',{orderId:order.id, paymentKey:'sim_'+uid(), amount:total});
    finishPayment(order.id, total);
  }catch(e){
    toast('결제 실패: '+e.message);
    if(btn){btn.disabled=false;btn.textContent=won(total)+' 결제하기';}
  }
}
function finishPayment(orderId,total){
  setCart([]);
  state._lastPay={orderId,total};
  go('paySuccess');
}

/* ---------- 로그인 ---------- */

async function doLogin(){
  const email=$('#email').value.trim(), pw=$('#pw').value;

  const btn=$('#loginBtn'); btn.disabled=true; btn.textContent='로그인 중...';
  try{ const r=await api('login',{email,pw}); afterAuth(r); toast('환영합니다, '+r.user.name+'님 🌱'); }
  catch(e){ toast(e.message); btn.disabled=false; btn.textContent='로그인'; }
}
async function social(provider){
  try{ const r=await api('social',{provider}); afterAuth(r); toast((provider==='kakao'?'카카오':'네이버')+' 로그인 완료'); }

/* ---------- 회원가입 ---------- */
function SignupView(v){

    <div class="sec" style="padding-top:24px">
      <div style="font-size:22px;font-weight:800">회원가입</div>

      <div class="field"><label>이름</label><input class="input" id="name" placeholder="이름"></div>

async function doSignup(){
  const name=$('#name').value.trim(), email=$('#email').value.trim(), phone=$('#phone').value.trim(), pw=$('#pw').value;
  if(!name||!email||!pw){ toast('이름·이메일·비밀번호는 필수예요'); return; }
  if(pw.length<6){ toast('비밀번호는 6자 이상'); return; }
  const btn=$('#suBtn'); btn.disabled=true; btn.textContent='가입 중...';
  try{ const r=await api('signup',{name,email,phone,pw}); afterAuth(r); toast('가입 완료! 환영해요 🌱'); }
  catch(e){ toast(e.message); btn.disabled=false; btn.textContent='가입하고 시작하기'; }
}
function afterAuth(r){
  state.token=r.token; state.user=r.user; ls.set('token',r.token);
  go(state.cart.length?'cart':'home');
}
async function doLogout(){ await api('logout'); state.user=null; state.token=null; ls.set('token',null); toast('로그아웃 되었습니다'); go('home'); }

/* ---------- 내 쇼핑몰 · 수익 대시보드 (분양 오너) ---------- */

  api('ownerStats').then(s=>{
    const link='https://jjondeugi.com/?ref='+(s.ownerCode||'');
    v.innerHTML=`
      <div class="hero" style="background:linear-gradient(135deg,#1B64DA,#16A34A)">
        <h2 style="font-size:18px">내 분양몰</h2>
        <p>오너 코드 ${esc(s.ownerCode)} · 판매마다 3% 즉시 캐시백</p>

      </div>
      <div class="stats">
        <div class="stat"><div class="sl">내 쇼핑몰 거래액(GMV)</div><div class="sv">${won(s.gmv)}</div></div>
        <div class="stat"><div class="sl">누적 주문</div><div class="sv">${s.orders}건</div></div>
        <div class="stat"><div class="sl">누적 수익(3%)</div><div class="sv g">${won(s.earned)}</div></div>
        <div class="stat"><div class="sl">출금 가능액</div><div class="sv g">${won(s.available)}</div></div>
      </div>
      <div class="sec" style="padding-top:4px">
        <div class="card" style="margin-bottom:12px">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px">내 쇼핑몰 링크</div>
          <div style="display:flex;gap:8px">
            <input class="input" style="height:44px;font-size:13px" id="reflink" value="${esc(link)}" readonly>

          </div>
        </div>
        <div class="notice" style="margin:0 0 12px">💰 정산은 배송완료 <b>D+7</b> 자동 지급, 출금 시 <b>3.3% 원천징수</b>가 적용됩니다.</div>

    $('#wl').innerHTML = (s.withdraws&&s.withdraws.length)? s.withdraws.slice().reverse().map(w=>`

        <div class="rsub">신청 ${won(w.gross)} · 세금 ${won(w.tax)} · ${new Date(w.createdAt).toLocaleDateString('ko-KR')}</div></div>
        <div class="rright"><span class="pill b">${esc(w.status)}</span></div></div>`).join('')

function OwnerOnboarding(v){
  v.innerHTML=`
    <div class="hero"><h2 style="font-size:20px">무자본으로 시작하는<br>내 쇼핑몰</h2>

    <div class="sec">
      ${[['📲','SNS 채널만으로 시작','상품 매입·재고·배송 부담 0'],
         ['💸','판매마다 3% 즉시 캐시백','브랜드 90 · 콩나물 7 · 오너 3'],
         ['🧾','D+7 자동 정산','출금 시 3.3% 원천징수 자동 처리']].map(([e,t,s])=>`
        <div class="card" style="display:flex;gap:12px;align-items:center;margin-bottom:10px">
          <div style="font-size:26px">${e}</div><div><div style="font-weight:700">${t}</div>
          <div style="font-size:13px;color:var(--text3)">${s}</div></div></div>`).join('')}
    </div>
    <div class="fixedbar"><button class="btn primary" id="beOwner" onclick="becomeOwner()">무료로 분양받기</button></div>`;

async function becomeOwner(){
  const b=$('#beOwner'); if(b){b.disabled=true;b.textContent='개설 중...';}
  try{ state.user=await api('becomeOwner'); toast('🎉 분양몰이 개설됐어요!'); go('owner'); }
  catch(e){ toast(e.message); if(b){b.disabled=false;b.textContent='무료로 분양받기';} }
}
function copyLink(){ const i=$('#reflink'); if(!i)return; navigator.clipboard?.writeText(i.value); i.select?.(); toast('링크를 복사했어요'); }
function openWithdraw(available){
  openSheet(`<h3>출금 신청</h3>
    <div style="padding:0 20px 8px">
      <div class="notice" style="margin:0 0 12px">출금 가능액 <b>${won(available)}</b> · 최소 10,000원</div>
      <div class="field"><label>출금 금액 (원)</label>
        <input class="input" id="wamt" type="number" inputmode="numeric" placeholder="0" oninput="calcWithdraw()"></div>
      <div class="card" style="background:var(--bg2)">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--text2)"><span>원천징수(3.3%)</span><span id="wtax">₩0</span></div>
        <div style="display:flex;justify-content:space-between;font-weight:800"><span>실수령액</span><span id="wnet" style="color:var(--primary)">₩0</span></div>
      </div>
      <button class="btn primary" style="margin-top:14px" onclick="submitWithdraw(${available})">출금 신청</button>
    </div>`);
}
function calcWithdraw(){ const g=Math.floor(+($('#wamt')?.value||0)); const tax=Math.round(g*CONFIG.WITHHOLD);
  if($('#wtax'))$('#wtax').textContent=won(tax); if($('#wnet'))$('#wnet').textContent=won(Math.max(0,g-tax)); }
async function submitWithdraw(available){
  const g=Math.floor(+($('#wamt')?.value||0));
  if(g<10000){ toast('최소 출금액은 10,000원이에요'); return; }
  if(g>available){ toast('출금 가능액을 초과했어요'); return; }
  try{ const r=await api('requestWithdraw',{amount:g}); closeSheet(); toast(`출금 신청 완료 · 실수령 ${won(r.net)}`); go('owner'); }
  catch(e){ toast(e.message); }
}

/* ============================================================
   부팅 — 결제 리다이렉트 처리 + 세션 복구
   ============================================================ */
async function boot(){
  state.token = ls.get('token', null);
  // 토스 결제 리다이렉트 처리
  const qs=new URLSearchParams(location.search);
  if(qs.get('pay')==='success'){
    const orderId=qs.get('orderId'), paymentKey=qs.get('paymentKey'), amount=Number(qs.get('amount'));
    try{ await api('confirmPayment',{orderId,paymentKey,amount}); }catch(e){}
    history.replaceState({},'',location.pathname);
    setCart([]); state._lastPay={orderId,total:amount};
    try{ state.user=await api('me'); }catch(e){}
    state.page='paySuccess'; render(); return;
  }
  if(qs.get('pay')==='fail'){ history.replaceState({},'',location.pathname); toast('결제가 취소되었어요'); }
  // 세션 복구
  try{ state.user = await api('me'); }catch(e){}
  await loadProducts();
  render();
}
window.addEventListener('popstate',()=>{ /* 단순 라우터: 홈으로 */ });
boot();
</script>
